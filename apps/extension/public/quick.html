<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>shadowinput</title><link rel="icon" href="icons/icon-32.png"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="quick.css"></head>
<body><main>
  <header><div class="brand"><img src="icons/icon-256.png" alt="" width="26" height="26"><span data-copy="quickTitle"></span></div><select id="language"><option value="zh">简体中文</option><option value="en">English</option></select></header>
  <section class="account" data-sign-in-only hidden><p id="status" role="status"></p><button id="connect" data-copy="connect"></button><button id="cancel-sign-in" hidden data-copy="cancel"></button></section>
  <form id="translation-form">
    <div class="toolbar"><label><span data-copy="target"></span><select id="target"><option value="zh-CN"></option><option value="en"></option><option value="ja"></option></select></label><label class="model"><span data-copy="model"></span><select id="model"></select></label><button id="refresh" type="button" data-copy="refresh"></button></div>
    <div class="editors"><label><span data-copy="source"></span><textarea id="source" maxlength="8000" spellcheck="false" autofocus></textarea></label><label><span data-copy="result"></span><textarea id="result" readonly></textarea></label></div>
    <div id="translation-activity" class="translation-activity" hidden><p id="translation-status" role="status" aria-live="polite"></p><button id="cancel" type="button" hidden data-copy="cancel"></button><button id="retry" type="button" hidden data-copy="retry"></button></div>
  </form>
  <p id="error" class="error" role="alert"></p>
  <p class="privacy" data-copy="privacy"></p>
  <footer><span data-copy="license"></span><a href="panel.html" target="_blank" rel="noreferrer" data-copy="openWorkbench"></a></footer>
</main><script type="module" src="app/panel.js"></script></body>
</html>
