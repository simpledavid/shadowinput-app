<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>shadowinput</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="popup.css"></head>
<body><main>
  <header><div class="brand"><img src="icons/icon-256.png" width="26" height="26" alt="">shadowinput</div></header>
  <section id="account-card" aria-labelledby="account-heading">
    <div class="account-row"><span id="account-heading" class="label"></span><button id="account" class="quiet" disabled></button></div>
    <p id="account-email" hidden></p>
    <p id="account-plan" class="hint" data-copy="plan" hidden></p>
  </section>
  <section class="preferences">
    <label class="field-row"><span data-copy="target"></span><select id="target"><option value="zh-CN"></option><option value="en"></option><option value="ja"></option></select></label>
    <div class="field-row"><label for="model" data-copy="model"></label><div class="model-row"><select id="model" disabled></select><button id="refresh" class="quiet" data-copy="refresh" disabled></button></div></div>
  </section>
  <section id="page-tools" hidden>
    <p id="host"></p>
    <div class="site-setting">
      <label class="switch-row"><span data-copy="auto"></span><input type="checkbox" role="switch" id="automatic" aria-describedby="host automatic-hint"></label>
      <small id="automatic-hint" hidden data-copy="autoHint"></small>
    </div>
    <label class="switch-row"><span data-copy="pin"></span><input type="checkbox" role="switch" id="pinned" aria-describedby="pin-hint"></label>
    <p id="pin-hint" class="hint" data-copy="pinHint"></p>
    <label class="switch-row"><span data-copy="hover"></span><input type="checkbox" role="switch" id="hover"></label>
    <div class="input-row"><button id="input" class="quiet" data-copy="input"></button><span class="hint" data-copy="inputKeys"></span></div>
  </section>
  <p class="hint selection-hint" data-copy="selectionHint"></p>
  <p id="status" role="status" aria-live="polite"></p>
</main><script type="module" src="app/popup.js"></script></body>
</html>
